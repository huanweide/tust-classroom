name: CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Syntax check
        run: python -m compileall -q . || true
      - name: Lint (informational)
        run: pip install ruff >/dev/null 2>&1; ruff check . || true
