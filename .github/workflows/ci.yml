name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Python 单元测试 + 静态检查
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 语法编译检查
        run: python -m compileall -q .

      - name: Ruff 静态检查
        run: ruff check .

      - name: Pytest 单元测试
        run: pytest -v

      - name: CLI 冒烟（不连浏览器，只验证命令可用）
        run: |
          python -m campusfree schools
          python -m campusfree check --school tust

  frontend:
    name: 前端资源校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 静态数据 JSON 合法性
        run: |
          python - <<'PY'
          import json, os, sys
          d = "static/data"
          bad = []
          for f in os.listdir(d):
              if f.endswith(".json"):
                  try:
                      json.load(open(os.path.join(d, f), encoding="utf-8"))
                  except Exception as e:
                      bad.append(f"{f}: {e}")
          if bad:
              print("损坏的 JSON：")
              print("\n".join(bad))
              sys.exit(1)
          print(f"static/data 下 JSON 全部合法")
          PY

      - name: 前端文件完整性
        run: |
          test -f static/index.html
          test -f static/manifest.json
          test -f static/sw.js
          test -f static/data/index.json
